# Infraestrutura de desenvolvimento local.
#
# PostgreSQL é publicado em 5433 no host para não colidir com uma instalação
# nativa de PostgreSQL em 5432. Dentro da rede do Compose a porta continua
# sendo 5432.
#
# MiniStack emula o SQS em 4566 — o mesmo endpoint do LocalStack, de modo que
# a escolha do emulador não vaza para o código da aplicação. Ver ADR-002.

name: wagering

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      # Falha cedo se o diretório de dados for inicializado sem senha.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ministack:
    image: ministackorg/ministack:1.5.33
    container_name: wagering-ministack
    restart: unless-stopped
    environment:
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_ACCOUNT_ID: '000000000000'
    ports:
      - '${SQS_PORT:-4566}:4566'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health',
          timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- aplicação ------------------------------------------------------------
  #
  # Sob o perfil `app`, de propósito: `bun run infra:up` continua subindo só
  # PostgreSQL e MiniStack, que é o que o desenvolvimento pede. Quem quer a
  # aplicação de pé — para ver três instâncias, como a seção 8 do enunciado
  # exige — pede o perfil explicitamente:
  #
  #   docker compose --profile app up -d --build --scale api=3
  #
  # As três réplicas aparecem em 3000, 3001 e 3002 do host, pelo intervalo
  # declarado em `ports`.

  # Preparação, num disparo só, antes de qualquer instância subir: migrations
  # e criação das filas.
  #
  # Serviço próprio porque é a única forma de o Compose garantir ordem de
  # verdade — `service_completed_successfully`. Deixar cada réplica aplicar
  # migrations na subida poria três delas disputando a tabela de controle do
  # migrator, e criar as filas três vezes é desperdício na melhor hipótese.
  bootstrap:
    profiles: ['app']
    build:
      context: .
    image: wagering-app
    container_name: wagering-bootstrap
    command:
      - sh
      - -c
      - 'bun run migration:up && bun run queues:bootstrap'
    environment: &app-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dentro da rede do Compose o PostgreSQL é `postgres:5432`, não
      # `localhost:5433` — a porta publicada no host não existe aqui.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_ENDPOINT: http://ministack:4566
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wagering-events.fifo}
      SQS_EVENTS_DLQ_NAME: ${SQS_EVENTS_DLQ_NAME:-wagering-events-dlq.fifo}
      SQS_CONSUMER_NAME: ${SQS_CONSUMER_NAME:-wager-transactions-consumer}
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
    image: wagering-app
    command: ['bun', 'src/main.ts']
    environment: *app-env
    # Intervalo, não porta única: com `--scale api=3` o Compose distribui uma
    # porta do intervalo para cada réplica. Porta única falharia na segunda.
    ports:
      - '3000-3002:3000'
    healthcheck:
      # `bun -e` em vez de `curl`: a imagem alpine não traz curl, e o Bun está
      # garantidamente lá.
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  worker:
    profiles: ['app']
    build:
      context: .
    image: wagering-app
    command: ['bun', 'src/worker.ts']
    environment: *app-env
    ports:
      - '3100-3102:3001'
    # O Compose manda SIGTERM e espera este prazo antes do SIGKILL. Precisa
    # ser maior que o WORKER_SHUTDOWN_TIMEOUT_MS da aplicação, senão o
    # encerramento gracioso da seção 10 nunca chega ao fim.
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3001/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: wagering-postgres-data
